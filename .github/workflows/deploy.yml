name: Deploy dashboard

# Publishes the dashboard to GitHub Pages whenever main moves. Because main is
# protected, the only way to trigger this is a merged pull request -- which is
# the point: the live site only ever reflects reviewed, tested code.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the job to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer merge supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Belt and braces: never publish a site built from failing code, even
      # though CI has already run this on the pull request.
      - name: Run the test suite
        run: python3 -m unittest discover -s tests

      - name: Build the dashboard
        run: python3 -m src.build_site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - id: deployment
        uses: actions/deploy-pages@v4

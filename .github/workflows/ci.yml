name: CI

# Runs on every pull request and every push to main. This is the check that
# branch protection requires, so a red run here blocks the merge.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Tests and site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No dependencies to install -- the project is standard library only.
      - name: Run the test suite
        run: python3 -m unittest discover -s tests -v

      - name: Build the dashboard
        run: python3 -m src.build_site

      - name: Confirm every project produced a page
        run: |
          expected=$(tail -n +2 data/projects.csv | grep -c . )
          actual=$(ls site/project-*.html | wc -l)
          echo "projects in CSV: $expected, pages generated: $actual"
          test "$expected" -eq "$actual"

      - name: Upload the built site for inspection
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.sha }}
          path: site/
          retention-days: 14
